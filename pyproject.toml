[project]
name = "maintenance-assistant"
version = "0.1.0"
description = "Cleris, the MRO clearance assistant: evidence-backed turbofan maintenance decisions"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "langgraph>=1.2.16",
    "lightgbm>=4.7.0",
    "pandas>=2.2",
    "plotly>=7.1.0",
    "psycopg[binary]>=3.2",
    "pyarrow>=17",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyyaml>=6",
    "scikit-learn>=1.9.1",
    "scipy>=1.17.1",
    "sqlglot>=25",
    "streamlit>=1.66.1",
    "tenacity>=9",
    "truststore>=0.10",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "taskipy>=1.13",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.taskipy.tasks]
check = "python -m tools.check_connections"
check-llm = "python -m tools.check_llm"
download = "python -m data.download_cmapss"
seed-telemetry = "python -m data.load_telemetry"
seed-cmms = "python -m data.generate_cmms"
register = "python -m data.register_zetaris"
fmea = "python -m data.build_fmea"
sensor-ranges = "python -m data.build_sensor_ranges"
snapshot = "python -m data.build_snapshot"
ingest-docs = "python -m data.ingest_docs"
train-fault-mode = "python -m models.train_fault_mode"
train-anomaly = "python -m models.train_anomaly"
train-rul = "python -m models.train_rul"
calibrate-rul = "python -m models.calibrate_rul"
load-context = "python -m casefile.load_context"
context-service = "npm --prefix context-service start"
test = "pytest -q"
eval = "python -m evaluation.run_eval"
fleet-triage = "python -m tools.triage"
eval-llm = "python -m evaluation.llm_critic_eval"
record-llm = "python -m tools.record_llm"
preflight = "python -m tools.preflight"
backup = "python -m tools.backup_cloud"
live-evidence = "python -m tools.live_evidence"
replay = "python -m tools.replay"
ui = "streamlit run ui/app.py --server.headless true"
db-up = "docker compose up -d postgres"
db-down = "docker compose down"
