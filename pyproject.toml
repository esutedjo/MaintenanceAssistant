[project]
name = "maintenance-assistant"
version = "0.1.0"
description = "Evidence-backed turbofan maintenance decision agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pandas>=2.2",
    "psycopg[binary]>=3.2",
    "pyarrow>=17",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyyaml>=6",
    "sqlglot>=25",
    "tenacity>=9",
    "truststore>=0.10",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "taskipy>=1.13",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.taskipy.tasks]
check = "python -m tools.check_connections"
test = "pytest -q"
db-up = "docker compose up -d postgres"
db-down = "docker compose down"
