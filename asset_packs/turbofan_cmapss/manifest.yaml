asset_type: turbofan_cmapss
version: 0.1.0
description: Two-spool high-bypass turbofan simulated by NASA C-MAPSS (FD001, FD003). Sea-level operating condition.
source: "Saxena, Goebel, Simon, Eklund (2008), Damage Propagation Modeling for Aircraft Engine Run-to-Failure Simulation, PHM08"

components:
  inlet: Fan inlet
  fan: Fan and bypass duct
  lpc: Low-pressure compressor
  hpc: High-pressure compressor
  combustor: Combustor
  hpt: High-pressure turbine
  lpt: Low-pressure turbine
  engine: Whole engine
  control: Engine control demands

failure_modes:
  hpc_degradation: {component: hpc, label: HPC degradation}
  fan_degradation: {component: fan, label: Fan degradation}
failure_modes_csv: fmea.csv
# Work-package templates per kind of work (engine change, module shop visit induction, borescope inspection): task
# references (synthetic), required inspection items, tooling, manhours and skills. The planner attaches the ones whose
# FMEA tasks are in the plan.
work_packages: work_packages.yaml
# Past removals in case memory carry the shop's finding as CMMS free text in capitals. The brief shows it in sentence
# case: these words stay in capitals and these shop abbreviations are spelled out.
shop_findings:
  keep_upper: [HPC, LPC, HPT, LPT, EGT, BPR, QEC, LLP]
  spell_out: {STG: stage, STGS: stages, CYC: cycles}

# Synthetic maintenance documents (markdown with front matter; one chunk per section). Ingested into
# knowledge.doc_chunks (pgvector) and data/snapshot/doc_chunks.parquet by `uv run task ingest-docs`.
documents:
  directory: asset_packs/turbofan_cmapss/docs
  files: [amm_rev3.md, amm_rev2.md, sb_72_0142.md, sb_72_0157.md, ad_2026_17_04.md]
  # When two documents address the same topic, the earlier type wins (then the later effective date).
  precedence: [airworthiness_directive, service_bulletin, manual, procedure]
  top_k: 4
# Failure modes each fleet variant can show (C-MAPSS: FD001 HPC only; FD003 HPC or fan). Keyed by assets.dataset.
variants:
  FD001: [hpc_degradation]
  FD003: [hpc_degradation, fan_degradation]

# direction: how the sensor moves as the fault grows (up | down | none).
# Measured on the training sets: end-of-life minus start-of-life median, over within-unit noise.
# FD003 units were split into the two modes by the sign of s_12 (s_7, s_20, s_21 agree on all 100 units).
sensors:
  s_1:  {name: T2,        unit: degR,    component: inlet,     description: Total temperature at fan inlet,          direction: {hpc_degradation: none, fan_degradation: none}}
  s_2:  {name: T24,       unit: degR,    component: lpc,       description: Total temperature at LPC outlet,         direction: {hpc_degradation: up,   fan_degradation: up}}
  s_3:  {name: T30,       unit: degR,    component: hpc,       description: Total temperature at HPC outlet,         direction: {hpc_degradation: up,   fan_degradation: up}}
  s_4:  {name: T50,       unit: degR,    component: lpt,       description: Total temperature at LPT outlet,         direction: {hpc_degradation: up,   fan_degradation: up}}
  s_5:  {name: P2,        unit: psia,    component: inlet,     description: Pressure at fan inlet,                   direction: {hpc_degradation: none, fan_degradation: none}}
  s_6:  {name: P15,       unit: psia,    component: fan,       description: Total pressure in bypass duct,           direction: {hpc_degradation: none, fan_degradation: none}}
  s_7:  {name: P30,       unit: psia,    component: hpc,       description: Total pressure at HPC outlet,            direction: {hpc_degradation: down, fan_degradation: up}}
  s_8:  {name: Nf,        unit: rpm,     component: fan,       description: Physical fan speed,                      direction: {hpc_degradation: up,   fan_degradation: up}}
  s_9:  {name: Nc,        unit: rpm,     component: hpc,       description: Physical core speed,                     direction: {hpc_degradation: up,   fan_degradation: up}}
  s_10: {name: epr,       unit: ratio,   component: engine,    description: Engine pressure ratio P50/P2,            direction: {hpc_degradation: none, fan_degradation: none}}
  s_11: {name: Ps30,      unit: psia,    component: hpc,       description: Static pressure at HPC outlet,           direction: {hpc_degradation: up,   fan_degradation: up}}
  s_12: {name: phi,       unit: pps/psi, component: combustor, description: Ratio of fuel flow to Ps30,              direction: {hpc_degradation: down, fan_degradation: up}}
  s_13: {name: NRf,       unit: rpm,     component: fan,       description: Corrected fan speed,                     direction: {hpc_degradation: up,   fan_degradation: up}}
  s_14: {name: NRc,       unit: rpm,     component: hpc,       description: Corrected core speed,                    direction: {hpc_degradation: up,   fan_degradation: up}}
  s_15: {name: BPR,       unit: ratio,   component: fan,       description: Bypass ratio,                            direction: {hpc_degradation: up,   fan_degradation: down}}
  s_16: {name: farB,      unit: ratio,   component: combustor, description: Burner fuel-air ratio,                   direction: {hpc_degradation: none, fan_degradation: none}}
  s_17: {name: htBleed,   unit: enthalpy, component: hpc,      description: Bleed enthalpy,                          direction: {hpc_degradation: up,   fan_degradation: up}}
  s_18: {name: Nf_dmd,    unit: rpm,     component: control,   description: Demanded fan speed,                      direction: {hpc_degradation: none, fan_degradation: none}}
  s_19: {name: PCNfR_dmd, unit: rpm,     component: control,   description: Demanded corrected fan speed,            direction: {hpc_degradation: none, fan_degradation: none}}
  s_20: {name: W31,       unit: lbm/s,   component: hpt,       description: HPT coolant bleed,                       direction: {hpc_degradation: down, fan_degradation: up}}
  s_21: {name: W32,       unit: lbm/s,   component: lpt,       description: LPT coolant bleed,                       direction: {hpc_degradation: down, fan_degradation: up}}

data_sources:
  telemetry: telemetry_pg.telemetry_long
  cycles: telemetry_pg.cycles
  assets: cmms_pg.assets
  work_orders: cmms_pg.work_orders
  findings: cmms_pg.findings
  parts_replaced: cmms_pg.parts_replaced
  parts: cmms_pg.planning_parts
  stock: cmms_pg.planning_stock
  hangar_slots: cmms_pg.planning_hangar_slots
  flight_schedule: cmms_pg.planning_flight_schedule
  fmea: s3_files.fmea

thresholds:
  rul_cap_cycles: 125
  cycles_per_day: 2
  # A and B disagree when more than this many cycles apart. A relative rule (25%) fired on 44% of the
  # active fleet with no link to A's error; the absolute rule fires on 27% and flagged engines have higher A error.
  rul_divergence_cycles: 20
  # Health-index residual vs the active-fleet median at the same cycle, in fleet standard deviations.
  anomaly_sigma: 2.0
  # Two fault modes this close in probability → inspect both modules.
  ambiguous_fault_probability: 0.15
  # Map remaining-life lower bound to an FMEA trigger severity.
  severe_rul_cycles: 25
  moderate_rul_cycles: 80

# Inspection findings an inspector enters (UI form; run.py and POST /run "inspections"). Limits are not here: they
# come from the documents' limit sections (topic limits:<kind>:<name>), which Knowledge retrieves and code compares.
inspections:
  kinds:
    borescope: Borescope
    visual: Visual
    oil_analysis: Oil analysis (spectrometric)
    chip_detector: Magnetic chip detector
    material_test: Material test (eddy current or other NDT)
  modules: {fan: Fan, lpc: LPC, hpc: HPC, combustor: Combustor, hpt: HPT, lpt: LPT, oil_system: Oil system}
  # A finding taken within this many cycles of the last observed cycle is fresh: it answers the planner's "methods
  # disagree" and "fault unclear" follow-ups in place of a back-test or a longer sensor window.
  fresh_cycles: 30
  # Re-inspection interval for a finding no limit section covers (inspector-classified, at the limit).
  default_reinspect_cycles: 10

# Input plausibility (deterministic, before any model runs). Ranges and largest cycle-to-cycle steps come from
# the run-to-failure training engines (`uv run task sensor-ranges`). A value may sit outside the training range by
# range_margin x (max - min), or by min_margin x |value| for sensors that never move. Issues on sensors the RUL
# models read are serious (confidence low, escalation); issues elsewhere are minor (flagged in the brief).
data_quality:
  ranges_file: sensor_ranges.json
  range_margin: 0.25
  min_margin: 0.01
  step_factor: 1.5
  frozen_cycles: 30
  max_missing_share: 0.0

# Schematic side view for the UI (upper half; drawn mirrored). Flow left to right. x: axial start/end;
# inner/outer: radius at start and end. Not to scale.
diagram:
  - {component: inlet,     label: Inlet,       x: [0.0, 0.8], inner: [0.0, 0.4], outer: [3.0, 3.0]}
  - {component: fan,       label: Fan,         x: [0.8, 1.5], inner: [0.4, 0.6], outer: [3.0, 3.0]}
  - {component: fan,       label: Bypass duct, x: [1.5, 6.0], inner: [1.75, 1.45], outer: [3.0, 2.6]}
  - {component: lpc,       label: LPC,         x: [1.5, 2.5], inner: [0.45, 0.5], outer: [1.65, 1.5]}
  - {component: hpc,       label: HPC,         x: [2.5, 4.5], inner: [0.5, 0.55], outer: [1.5, 1.2]}
  - {component: combustor, label: Combustor,   x: [4.5, 5.5], inner: [0.55, 0.55], outer: [1.2, 1.25]}
  - {component: hpt,       label: HPT,         x: [5.5, 6.2], inner: [0.55, 0.55], outer: [1.25, 1.35]}
  - {component: lpt,       label: LPT,         x: [6.2, 8.0], inner: [0.5, 0.45], outer: [1.35, 1.8]}

